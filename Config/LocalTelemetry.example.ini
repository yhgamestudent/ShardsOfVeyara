; [안내] 이 파일은 템플릿입니다. 실제 사용할 때는 이 파일을 복사하여
; Config/LocalTelemetry.ini 로 이름을 바꾼 후 본인의 웹 앱 URL과 비밀 토큰을 입력하세요.
; Config/LocalTelemetry.ini 는 .gitignore 에 등록되어 있어 Git에 커밋되지 않습니다.
[TelemetryConfig]
GoogleSheetsWebAppURL="https://script.google.com/macros/s/YOUR_WEB_APP_ID/exec"
GoogleSheetsAuthToken="YOUR_SECRET_AUTH_TOKEN"
